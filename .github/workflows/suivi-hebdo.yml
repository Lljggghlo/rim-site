name: Suivi hebdomadaire du référencement

# Chaque dimanche : Search Console et Analytics → rapport lu par le robot pour décider quoi reprendre.
on:
  schedule:
    - cron: '30 2 * * 0'
  workflow_dispatch:
  # Relance automatique quand le suivi lui-même est modifié (sert de test après chaque changement)
  push:
    branches: [main]
    paths: ['robot/suivi.mjs', 'robot/performance.mjs', '.github/workflows/suivi-hebdo.yml']

permissions:
  contents: write
  issues: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  suivi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Relever Search Console et Analytics
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          set -o pipefail
          robot/ci/etat.sh tirer
          node robot/suivi.mjs etat 2>&1 | tee /tmp/suivi.log
      - name: Mesurer la vitesse du site (Lighthouse, profil téléphone)
        continue-on-error: true
        run: node robot/performance.mjs etat 2>&1 | tail -80
      - name: Enregistrer le résultat
        if: always()
        run: robot/ci/etat.sh pousser
      - name: Alerte en cas d'échec
        if: failure()
        run: |
          robot/ci/alerte.sh "Robot blog : suivi du référencement en échec" /tmp/suivi.log
